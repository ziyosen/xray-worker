[package]
name = "changli"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.105"
tokio = { version = "1.28", features = ["io-util", "rt"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
worker = "=0.8.6"
worker-sys = "=0.8.6"
worker-macros = "=0.8.6"
uuid = { version = "=1.24.1", features = ["v4", "js"] }
futures-util = "0.3.28"
pin-project-lite = "0.2"
bytes = "1.4.0"
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.10"
md-5 = "0.10"
anyhow = "1.0.86"
reqwest = "0.12.5"
regex = "1.11.1"
once_cell = "1.21.3"
pretty-bytes = "0.2.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

name: Run CF Changle

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cf
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (pinned)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: deploy
        env:
          RUSTFLAGS: "-C symbol-mangling-version=legacy -Zunstable-options -C target-feature=+reference-types"
        uses: cloudflare/wrangler-action@v3
        with:
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
